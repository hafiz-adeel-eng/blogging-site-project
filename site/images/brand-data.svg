ath d="m587 350 9 9 16-19" stroke="#517daf" stroke-width="4" fill="none" stroke-linecap="round"/><text x="600" y="420" fill="white" font-family="Arial,sans-serif" font-size="27" text-anchor="middle">One brand entity</text><text x="600" y="458" fill="#dae9fa" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">brand_id: luma-labs</text><g fill="#354557" stroke="#8a9eb5"><rect x="870" y="190" width="240" height="100" rx="18"/><rect x="870" y="350" width="240" height="100" rx="18"/><rect x="870" y="510" width="240" height="100" rx="18"/></g><g fill="#e9f0f9" font-family="Arial,sans-serif" font-size="21"><text x="897" y="237">Mentions</text><text x="897" y="397">Recommendations</text><text x="897" y="557">Source evidence</text></g><g fill="#b0becd" font-family="Arial,sans-serif" font-size="12"><text x="897" y="264">COUNT SEPARATELY</text><text x="897" y="424">EXPLICIT ENDORSEMENT</text><text x="897" y="584">PRESERVE PROVENANCE</text></g><text x="90" y="95" fill="#b1c9e5" font-family="Arial,sans-serif" font-size="13" letter-spacing="4">DAILYVERTEX / THE DATA FIELD GUIDE</text><text x="90" y="725" fill="#8ba2bd" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">ILLUSTRATIVE WORKFLOW — NOT A VENDOR ARCHITECTURE</text></svg>
